services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-5}
    volumes:
      - backend_uploads:/app/uploads
      - backend_db:/app/db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    environment:
      # Local dev stays auth-free: BASIC_AUTH_USER/PASSWORD unset here.
      # A public deploy (see DEPLOY.md) sets these to require a login.
      - BACKEND_HOST=backend
      - BACKEND_PORT=8000
      - BASIC_AUTH_USER=${BASIC_AUTH_USER:-}
      - BASIC_AUTH_PASSWORD=${BASIC_AUTH_PASSWORD:-}
    depends_on:
      - backend

volumes:
  backend_uploads:
  backend_db:
